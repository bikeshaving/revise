name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - run: bun install --frozen-lockfile

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Build crankeditable
        run: npm run build
        working-directory: packages/crankeditable

  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - run: bun install --frozen-lockfile

      - name: Install the unit runner's Chromium
        run: npx --no playwright-core install --with-deps chromium

      - name: Unit tests
        run: npm test

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - run: bun install --frozen-lockfile

      - run: bun install --frozen-lockfile
        working-directory: packages/crankeditable

      - name: Build crankeditable
        run: npm run build
        working-directory: packages/crankeditable

      # The website installs crankeditable from packages/, so it must be built first.
      - run: bun install --frozen-lockfile
        working-directory: website

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: End-to-end tests
        run: npm run test:e2e
